# Review decisions for graph hcmc_district1_v3_p2 (docs/graph_v2_design.md, Section 4).
# One decision per regular street card and per junction card of docs/reports/graph_review_hcmc_district1_v3_p2.md.
# How the decisions were made (2026-11-25):
# - Every card was generated with automatic flags (graph/review.py).
# - The 118 cards with geometric flags (dead ends, pieces, short or isolated streets,
#   divided-road imbalance, wide / many-node / connector / place-split / meet-without-shared-node
#   junctions) were checked on screenshots of the street base map and satellite imagery.
#   Junction findings (one square split in two, a street-like square, crossings split into
#   several junctions) were fixed by rules, not overrides: one junction per place, merging of
#   split crossings, and "Công trường Lam Sơn" treated as a street (street_like_places).
# - The 17 junction cards produced by the merge rule were checked in a second visual pass:
#   all 17 consistent (one real crossing each).
# - Streets whose OSM data visibly disagrees with reality, or whose images were not conclusive,
#   are excluded from questions (owner decision Q-A); they stay in the graph for routing.
# - Cards without flags are accepted on the automatic checks; the owner audit samples them.
# A card whose facts or flags change in a later build must be reviewed again.
