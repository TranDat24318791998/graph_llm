[project]
name = "graph-llm"
version = "0.1.0"
description = "Controlled comparison of graph representations for LLM question answering on urban road networks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "osmnx>=2.1.2",
    "pydantic>=2.7",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "ruff>=0.6",
    "types-networkx>=3.6.1.20261114",
    "types-pyyaml>=6.0.12.20261113",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_llm"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "N",   # naming conventions
    "UP",  # modern Python syntax
    "B",   # likely bugs
    "SIM", # simplifications
    "D",   # docstrings
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
